<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0A5151"><title>Coastal Guardian — Feedback Inbox</title>
<style>
:root{--panel:#0d2b35;--text:#effbfc;--muted:#b4d0d5;--accent:#50d3b7;--gold:#F2C14E;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#06171e;color:var(--text)}.wrap{max-width:1180px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}h1{margin:0}a,button{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:#173f4b;color:#fff;text-decoration:none;font:800 13px inherit;cursor:pointer}button.primary{background:var(--gold);color:#073737}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}input,select{border:1px solid var(--line);border-radius:10px;background:#061b22;color:#fff;padding:10px;font:inherit}.login{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:15px;padding:14px;background:rgba(255,255,255,.04)}.item.new{border-color:rgba(80,211,183,.6)}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.meta{color:var(--muted);font-size:12px}.comment{white-space:pre-wrap;line-height:1.45;margin-top:10px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{padding:4px 7px;border:1px solid var(--line);border-radius:999px;font-size:11px}.item-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}#msg{color:var(--muted);font-size:13px}@media(max-width:700px){.login{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><div><div style="color:#50d3b7;font-weight:900;font-size:12px">COASTAL GUARDIAN</div><h1>Feedback Inbox</h1></div><a href="index.html">Website Home</a></div>
<div class="card" id="loginCard"><div class="login"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="primary" id="loginBtn">Sign In</button></div><div id="msg" style="margin-top:8px">Authorized Coastal Guardian admin account required.</div></div>
<div id="inbox" hidden><div class="card filters"><strong id="count">0 submissions</strong><select id="statusFilter"><option value="">All statuses</option><option value="new">New</option><option value="read">Read</option><option value="archived">Archived</option></select><select id="gameFilter"><option value="">All games</option><option value="full_campaign">Full Campaign</option><option value="kiosk">Kiosk</option><option value="website">Website</option></select><button id="refreshBtn">Refresh</button><button id="exportBtn">Export CSV</button><button id="logoutBtn">Sign Out</button></div><div class="list" id="list"></div></div></div>
<script>
const SUPABASE_URL="https://uzjxkohfpcbnexljgfdd.supabase.co",SUPABASE_KEY="sb_publishable_Q_XHOPtwfAw1Cq6YjI_wAQ_Vw_vXvzx";
const storage={
  get(k){try{return sessionStorage.getItem(k)||''}catch(e){return ''}},
  set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},
  remove(k){try{sessionStorage.removeItem(k)}catch(e){}}
};
let token=storage.get('cg_admin_token'),rows=[];const $=id=>document.getElementById(id);
async function signIn(){$('msg').textContent='Signing in…';const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const j=await res.json().catch(()=>({}));if(!res.ok||!j.access_token){$('msg').textContent='Sign-in failed.';return}token=j.access_token;storage.set('cg_admin_token',token);await load()}
async function api(path,opts={}){const res=await fetch(SUPABASE_URL+path,{...opts,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});if(res.status===401||res.status===403)throw new Error('Not authorized');return res}
async function load(){try{const res=await api('/rest/v1/feedback?select=*&order=created_at.desc&limit=500');if(!res.ok)throw new Error('Not authorized');rows=await res.json();$('loginCard').hidden=true;$('inbox').hidden=false;render()}catch(e){storage.remove('cg_admin_token');token='';$('loginCard').hidden=false;$('inbox').hidden=true;$('msg').textContent='Signed in account is not authorized for the feedback inbox.'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const sf=$('statusFilter').value,gf=$('gameFilter').value;const f=rows.filter(r=>(!sf||r.status===sf)&&(!gf||r.game_type===gf));$('count').textContent=f.length+' submission'+(f.length===1?'':'s');$('list').innerHTML=f.map(r=>`<article class="item ${esc(r.status)}"><div class="row"><strong>${esc(r.category)} — ${esc(r.game_type)} ${esc(r.game_version||'')}</strong><span class="meta">${new Date(r.created_at).toLocaleString()}</span></div><div class="badges"><span class="badge">${esc(r.status)}</span>${r.reviewer_role?`<span class="badge">${esc(r.reviewer_role)}</span>`:''}${r.overall_rating?`<span class="badge">Overall ${r.overall_rating}/5</span>`:''}</div>${r.reviewer_name||r.contact_email?`<div class="meta" style="margin-top:8px">${esc(r.reviewer_name||'')} ${r.contact_email?'• '+esc(r.contact_email):''}</div>`:''}${r.bug_report?`<div class="comment"><b>Issue:</b> ${esc(r.bug_report)}</div>`:''}${r.comments?`<div class="comment">${esc(r.comments)}</div>`:''}<div class="item-actions"><button onclick="setStatus('${r.id}','read')">Mark Read</button><button onclick="setStatus('${r.id}','archived')">Archive</button><button onclick="setStatus('${r.id}','new')">Mark New</button></div></article>`).join('')||'<div class="card">No feedback matches these filters.</div>'}
async function setStatus(id,status){const res=await api('/rest/v1/feedback?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status})});if(res.ok){const x=rows.find(r=>r.id===id);if(x)x.status=status;render()}}
function exportCsv(){const cols=['created_at','status','game_type','game_version','reviewer_role','reviewer_name','contact_email','category','educational_value','ease_of_use','visual_quality','overall_rating','bug_report','comments','source_url'];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[cols.join(','),...rows.map(r=>cols.map(c=>q(r[c])).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='coastal_guardian_feedback.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
$('loginBtn').onclick=signIn;$('refreshBtn').onclick=load;$('exportBtn').onclick=exportCsv;$('logoutBtn').onclick=()=>{storage.remove('cg_admin_token');location.reload()};$('statusFilter').onchange=render;$('gameFilter').onchange=render;if(token)load();
</script></body></html>
